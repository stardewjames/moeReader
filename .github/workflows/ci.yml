name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    # A cold OpenJDK Mobile (HotSpot Zero) build for iOS takes most of this;
    # cached runs take minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: brew install autoconf make xcodegen
      # Commits from Windows checkouts may not carry the executable bit.
      - run: chmod +x SuwayomiHost/gradlew SuwayomiHost/jvm-ios/*.sh
      - run: xcodebuild -version
      - name: Suwayomi host tests
        working-directory: SuwayomiHost
        run: ./gradlew --console=plain :host:test
      - name: Build the host jar on JDK 21
        working-directory: SuwayomiHost
        run: ./gradlew --console=plain -q :host:shadowJar
      # The VM part of the runtime only changes with jvm-ios/ and the HotSpot
      # options; the host jar is refreshed even when the VM cache hits.
      - name: Restore the Suwayomi runtime
        id: jvm
        uses: actions/cache@v5
        with:
          path: SuwayomiHost/build/runtime/ios
          key: suwayomi-openjdk-ios-${{ hashFiles('SuwayomiHost/jvm-ios/fetch-openjdk.sh', 'SuwayomiHost/jvm-ios/build-openjdk-macos.sh', 'SuwayomiHost/jvm-ios/build-openjdk-ios.sh', 'SuwayomiHost/jvm-ios/package.sh', 'SuwayomiHost/jvm-options/openjdk.options') }}
      - name: Refresh the cached runtime
        if: steps.jvm.outputs.cache-hit == 'true'
        run: HOST_ONLY=1 SKIP_HOST_BUILD=1 SuwayomiHost/jvm-ios/package.sh
      # The iOS cross build needs the JDK 26 boot JDK (the build itself is 27).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - name: Build HotSpot Zero for iOS
        if: steps.jvm.outputs.cache-hit != 'true'
        working-directory: SuwayomiHost/jvm-ios
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          ./fetch-openjdk.sh
          ./build-openjdk-macos.sh
          ./build-openjdk-ios.sh iphoneos
          SKIP_HOST_BUILD=1 ./package.sh
      - run: ./scripts/build_ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: MoeReader-unsigned-ipa
          path: MoeReader.ipa
          if-no-files-found: error
