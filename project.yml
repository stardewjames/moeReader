name: MoeReader
options:
  bundleIdPrefix: com.moereader
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
targets:
  MoeReader:
    type: application
    platform: iOS
    sources:
      - path: MoeReader
        excludes:
          - "Resources"
          - "Resources/**"
          - "Info.plist"
      - path: MoeReader/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moereader.MoeReader
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MoeReader/Info.plist
    info:
      path: MoeReader/Info.plist
      properties:
        CFBundleDisplayName: MoeReader
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.moereader.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
          - UTTypeIdentifier: com.moereader.cbt
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo:
              - public.tar-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - cbt
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.moereader.cbz
              - com.moereader.cbt
  MoeReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoeReaderTests
        excludes:
          - "Fixtures"
          - "Fixtures/**"
      - path: MoeReaderTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MoeReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moereader.MoeReaderTests
        GENERATE_INFOPLIST_FILE: YES
  MoeReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoeReaderUITests
    dependencies:
      - target: MoeReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moereader.MoeReaderUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoeReader:
    build:
      targets:
        MoeReader: all
        MoeReaderTests: [test]
        MoeReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MoeReaderTests
        - MoeReaderUITests
